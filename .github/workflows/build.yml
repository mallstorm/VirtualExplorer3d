name: Build Virtual Explorer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export:
    name: Godot export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            ln -sfn /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          fi
          if [ ! -d ~/.local/share/godot/export_templates/4.3.stable ]; then
            curl -L -o /tmp/godot_templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -q /tmp/godot_templates.tpz -d /tmp/godot_templates
            mv /tmp/godot_templates/templates ~/.local/share/godot/export_templates/4.3.stable
          fi

      - name: Setup Android export settings
        run: |
          JAVA_SDK_PATH="${JAVA_HOME:-}"
          if [ -z "$JAVA_SDK_PATH" ] || [ ! -d "$JAVA_SDK_PATH" ]; then
            JAVA_SDK_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          fi
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_SDK_PATH"
          export/android/debug_keystore = "debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: godot --headless --path . --import

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/VirtualExplorer.exe

      - name: Export Android debug
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android Debug" build/android/VirtualExplorer-debug.apk

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualExplorer-Windows
          path: build/windows/
          retention-days: 14

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualExplorer-Android-debug
          path: build/android/
          retention-days: 14
